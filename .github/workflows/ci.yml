# 拾语 CI：Windows 上构建整个解决方案并跑 Core 单测；Linux 上跑公共通道
# Worker 的类型检查与 vitest。两个 job 互不依赖，并行执行。
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同一分支（或同一个 PR）有新提交时，取消还在跑的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    # Shiyu.App / Shiyu.Windows 是 net9.0-windows（WPF），只能在 Windows 上构建。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 还原依赖
        run: dotnet restore Shiyu.sln

      - name: 构建（Release）
        run: dotnet build Shiyu.sln -c Release --no-restore

      - name: Core 单测
        id: test
        run: dotnet test tests/Shiyu.Core.Tests/Shiyu.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      # O-24：catch (Exception) 块必须接日志或声明 expected——静默即失败。
      - name: 静默 catch 检查
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/checks/no-silent-catch.ps1

      # 票 19：Themes/ 外禁字面量字号/圆角/文字透明度——字面量会绕过令牌与对比度测试。
      # 豁免须带 token-ok: 注释写明理由。
      - name: 硬编码令牌检查
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/checks/no-hardcoded-tokens.ps1

      - name: 单测失败时上传结果
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # package.json 没有 engines 字段；锁定的 wrangler 4 / miniflare 要求 Node >= 22。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单测（vitest）
        run: npm test
